name: ci

# §4: the gate lives on the pull request. This repo deployed from main with
# nothing checking a change first, so the deploy was the first thing to find out.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is the required-check context; the estate requires `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax across every tracked script
        # This repo is the estate's shell library; a syntax error here is only
        # found when someone runs the script on a live host.
        run: |
          fail=0; n=0
          for f in $(git ls-files '*.sh'); do
            n=$((n+1))
            bash -n "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done
          echo "checked $n shell scripts"
          [ "$n" -gt 0 ] || { echo "::error::no scripts found to check"; exit 1; }
          exit $fail
